<!doctype html>
<html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orders | Jija Studio Admin</title><link rel="stylesheet" href="css/style.css"><style>.orders-shell{max-width:1100px;margin:35px auto;padding:0 16px}.orders-login,.order-card{background:#fff;border:1px solid #e4dfd5;border-radius:14px;padding:18px;margin:12px 0}.orders-login{max-width:460px;margin:60px auto}.orders-login input,.order-card select{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px;margin:6px 0 12px}.order-card h3{margin:0 0 8px}.order-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}.muted{color:#71695d}.orders-status{min-height:24px;color:#174d38}.order-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.order-items{padding-left:20px}@media print{button,select,.orders-login{display:none}}</style></head>
<body><header class="site-header"><div class="container header-inner"><a class="brand" href="index.html"><span class="brand-name">Jija Studio</span><span class="brand-tagline">Admin · Orders</span></a><nav class="main-nav"><a href="admin.html">Product Admin</a><a href="index.html">Storefront</a></nav></div></header>
<main class="orders-shell"><h1>Customer orders</h1><p class="muted">Sign in with an authorized Firebase admin account. Database rules must restrict order access to admins.</p>
<form id="login" class="orders-login"><h2>Admin sign in</h2><label>Email<input id="email" type="email" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button class="button button-primary" type="submit">Sign in</button><p id="login-status" class="orders-status" role="status"></p></form>
<section id="orders-panel" hidden><div class="order-actions"><button id="refresh" class="button button-outline">Refresh orders</button><button id="logout" class="button button-outline">Sign out</button></div><p id="orders-status" class="orders-status" role="status"></p><div id="orders-list"></div></section></main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
import { firebaseConfig } from "./js/firebase-config.js";
const app=initializeApp(firebaseConfig,"jija-orders-admin"),auth=getAuth(app),db=getDatabase(app);
const $=id=>document.getElementById(id),money=v=>new Intl.NumberFormat("en-IN",{style:"currency",currency:"INR",maximumFractionDigits:0}).format(Number(v)||0);
$("login").addEventListener("submit",async e=>{e.preventDefault();$("login-status").textContent="Signing in…";try{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value)}catch(err){$("login-status").textContent="Sign in failed: "+(err.code||err.message)}});
onAuthStateChanged(auth,user=>{if(user){$("login").hidden=true;$("orders-panel").hidden=false;loadOrders()}else{$("login").hidden=false;$("orders-panel").hidden=true}});
$("logout").addEventListener("click",()=>signOut(auth));$("refresh").addEventListener("click",loadOrders);
async function loadOrders(){ $("orders-status").textContent="Loading orders…";try{const snap=await get(ref(db,"orders"));const raw=snap.exists()?snap.val():{};const orders=Object.entries(raw).map(([id,o])=>({...o,id})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));$("orders-status").textContent=orders.length+" order(s)";$("orders-list").innerHTML=orders.map(o=>'<article class="order-card"><h3>'+esc(o.orderNumber||o.id)+' · '+esc(o.paymentStatus||"pending")+'</h3><div class="order-grid"><div><strong>Customer</strong><br>'+esc(o.customer?.name)+'<br>'+esc(o.customer?.phone)+'</div><div><strong>Delivery address</strong><br>'+esc(o.customer?.address)+'<br>PIN '+esc(o.customer?.pin)+'</div><div><strong>Payment</strong><br>'+money(o.total)+' · '+esc(o.razorpayPaymentId||"Not captured")+'<br><span class="muted">Created '+new Date(o.createdAt||Date.now()).toLocaleString("en-IN")+'</span></div></div><ul class="order-items">'+(o.items||[]).map(i=>'<li>'+esc(i.name)+' ('+esc(i.size||"One Size")+(i.colour?' · '+esc(i.colour):'')+') × '+Number(i.quantity||0)+' — '+money(i.lineTotal)+'</li>').join('')+'</ul><label>Fulfilment status <select data-order-status="'+esc(o.id)+'">'+["confirmed","processing","packed","shipped","delivered","cancelled"].map(s=>'<option value="'+s+'" '+(o.orderStatus===s?'selected':'')+'>'+s+'</option>').join('')+'</select></label><button class="button button-outline" data-save-order="'+esc(o.id)+'">Save status</button><p class="muted">WhatsApp: '+esc(o.whatsappNotificationStatus||"pending")+'</p></article>').join('')||'<p>No orders yet.</p>';$("orders-list").querySelectorAll("[data-save-order]").forEach(b=>b.addEventListener("click",async()=>{const id=b.dataset.saveOrder;const status=$("orders-list").querySelector('[data-order-status="'+CSS.escape(id)+'"]').value;try{await update(ref(db,"orders/"+id),{orderStatus:status,updatedAt:Date.now()});$("orders-status").textContent="Status saved."}catch(err){$("orders-status").textContent="Could not update status. Check admin database rules: "+err.message}})});}catch(err){$("orders-status").textContent="Could not load orders. Check Realtime Database rules for admin access: "+err.message}}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
</script></body></html>
