<!doctype html>
<html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orders | Jija Studio Admin</title><link rel="stylesheet" href="css/style.css"><style>.orders-shell{max-width:1100px;margin:35px auto;padding:0 16px}.orders-login,.order-card{background:#fff;border:1px solid #e4dfd5;border-radius:14px;padding:18px;margin:12px 0}.orders-login{max-width:460px;margin:60px auto}.orders-login input,.order-card select{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px;margin:6px 0 12px}.order-card h3{margin:0 0 8px}.order-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}.muted{color:#71695d}.orders-status{min-height:24px;color:#174d38}.order-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.order-items{padding-left:20px}@media print{button,select,.orders-login{display:none}}</style></head>
<body><header class="site-header"><div class="container header-inner"><a class="brand" href="index.html"><span class="brand-name">Jija Studio</span><span class="brand-tagline">Admin · Orders</span></a><nav class="main-nav"><a href="admin.html">Product Admin</a><a href="index.html">Storefront</a></nav></div></header>
<main class="orders-shell"><h1>Customer orders</h1><p class="muted">Sign in with an authorized Firebase admin account. Database rules must restrict order access to admins.</p>
<form id="login" class="orders-login"><h2>Admin sign in</h2><label>Email<input id="email" type="email" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button class="button button-primary" type="submit">Sign in</button><p id="login-status" class="orders-status" role="status"></p></form>
<section id="orders-panel" hidden><div class="order-actions"><button id="refresh" class="button button-outline">Refresh orders</button><button id="logout" class="button button-outline">Sign out</button></div><p id="orders-status" class="orders-status" role="status"></p><div id="orders-list"></div></section></main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { firebaseConfig } from "./js/firebase-config.js";

const app = initializeApp(firebaseConfig, "jija-orders-admin-v2");
const auth = getAuth(app);
const PAYMENT_BACKEND = "https://jija-studio-payments.jijastudio-payments-test.workers.dev";
const $ = id => document.getElementById(id);
const money = value => new Intl.NumberFormat("en-IN", {style:"currency",currency:"INR",maximumFractionDigits:0}).format(Number(value)||0);
function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
}
async function api(path, body = {}) {
  if (!auth.currentUser) throw new Error("Please sign in again.");
  const token = await auth.currentUser.getIdToken();
  const response = await fetch(PAYMENT_BACKEND + path, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Accept": "application/json",
      "Authorization": "Bearer " + token,
      "X-Firebase-Api-Key": firebaseConfig.apiKey
    },
    body: JSON.stringify(body)
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.error || "The order service could not complete the request.");
  return data;
}
$("login").addEventListener("submit", async event => {
  event.preventDefault();
  $("login-status").textContent = "Signing in…";
  try {
    await signInWithEmailAndPassword(auth, $("email").value.trim(), $("password").value);
  } catch (error) {
    $("login-status").textContent = "Sign in failed: " + (error.code || error.message);
  }
});
onAuthStateChanged(auth, user => {
  if (user) {
    $("login").hidden = true;
    $("orders-panel").hidden = false;
    loadOrders();
  } else {
    $("login").hidden = false;
    $("orders-panel").hidden = true;
  }
});
$("logout").addEventListener("click", () => signOut(auth));
$("refresh").addEventListener("click", loadOrders);

async function loadOrders() {
  $("orders-status").textContent = "Loading orders…";
  try {
    const data = await api("/api/admin/orders");
    const orders = (data.orders || []).sort((a,b) => (b.createdAt || 0) - (a.createdAt || 0));
    $("orders-status").textContent = orders.length + " order(s)";
    $("orders-list").innerHTML = orders.map(order => {
      const customer = order.customer || {};
      const items = Array.isArray(order.items) ? order.items : [];
      const statusChoices = ["confirmed","processing","packed","shipped","delivered","cancelled"]
        .map(status => '<option value="' + status + '" ' + (order.orderStatus === status ? "selected" : "") + '>' + status + '</option>').join("");
      const paid = order.paymentStatus === "paid";
      const statusTools = paid
        ? '<label>Fulfilment status <select data-order-status="' + esc(order.id) + '">' + statusChoices + '</select></label><button class="button button-outline" data-save-order="' + esc(order.id) + '">Save status</button>'
        : '<p class="muted">Fulfilment status can be updated after payment is confirmed.</p>';
      const customerPhone = String(customer.phone || "").replace(/[^0-9]/g, "");
      const whatsapp = customerPhone
        ? '<a target="_blank" rel="noopener" href="https://wa.me/' + esc(customerPhone) + '?text=' + encodeURIComponent("Hello " + (customer.name || "") + " — Jija Studio order " + (order.orderNumber || order.id) + ".") + '">WhatsApp customer</a>'
        : "";
      const itemHtml = items.map(item => '<li>' + esc(item.name) + ' (' + esc(item.size || "One Size") + (item.colour ? ' · ' + esc(item.colour) : '') + ') × ' + Number(item.quantity || 0) + ' — ' + money(item.lineTotal) + '</li>').join("");
      const notifyStatus = order.whatsappNotificationStatus === "sent" ? "sent" : (order.whatsappNotificationStatus === "failed" ? "failed — check WhatsApp API settings" : "not configured");
      return '<article class="order-card"><h3>' + esc(order.orderNumber || order.id) + ' · ' + esc(order.paymentStatus || "pending") + '</h3>' +
        '<div class="order-grid"><div><strong>Customer</strong><br>' + esc(customer.name || "Not provided") + '<br>' + esc(customer.phone || "Not provided") + (whatsapp ? '<br>' + whatsapp : '') +
        '</div><div><strong>Delivery address</strong><br>' + esc(customer.address || "Not provided") + '<br>PIN ' + esc(customer.pin || "—") +
        '</div><div><strong>Payment</strong><br>' + money(order.total) + ' · ' + esc(order.razorpayPaymentId || "Not captured") +
        '<br><span class="muted">Created ' + new Date(order.createdAt || Date.now()).toLocaleString("en-IN") + '</span></div></div>' +
        '<ul class="order-items">' + itemHtml + '</ul>' + statusTools +
        '<p class="muted">Automatic WhatsApp alert: ' + esc(notifyStatus) + '</p></article>';
    }).join("") || '<p>No checkout orders yet.</p>';
    $("orders-list").querySelectorAll("[data-save-order]").forEach(button => {
      button.addEventListener("click", async () => {
        const id = button.dataset.saveOrder;
        const selector = '[data-order-status="' + CSS.escape(id) + '"]';
        const status = $("orders-list").querySelector(selector).value;
        button.disabled = true;
        try {
          await api("/api/admin/order-status", {id, status});
          $("orders-status").textContent = "Order status saved.";
        } catch (error) {
          $("orders-status").textContent = "Could not save status: " + error.message;
        } finally {
          button.disabled = false;
        }
      });
    });
  } catch (error) {
    $("orders-status").textContent = "Could not load orders: " + error.message + " If this says admin access denied, sign in with the authorized store admin email.";
  }
}
</script></body></html>
